server {
    listen 80;
    listen [::]:80;
    server_name entry.w-pcp.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name entry.w-pcp.dev;

    # Cloudflare Origin CA certificate and private key.
    ssl_certificate /etc/ssl/cloudflare/entry.w-pcp.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/entry.w-pcp.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Entry Ticket System";
    auth_basic_user_file /etc/nginx/.htpasswd-entry-w-pcp;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve the browser's Basic Authorization header for the backend.
        proxy_set_header Authorization $http_authorization;

        # Required for the server-sent events endpoint.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /api {
        proxy_pass http://127.0.0.1:4000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
